<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean & Care Class | SMAN 1 Batujaya</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #10b981;
      --bg: #020617;
      --card-bg: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
      --text-gray: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background-color: var(--bg); 
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .blob {
      position: fixed; width: 400px; height: 400px;
      background: var(--primary); filter: blur(120px);
      opacity: 0.1; border-radius: 50%; z-index: -1;
    }

    nav {
      padding: 25px 10%; display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; backdrop-filter: blur(10px); z-index: 100;
    }
    .logo { font-size: 20px; font-weight: 700; color: var(--primary); letter-spacing: -1px; }

    .hero { padding: 100px 10% 60px; text-align: center; }
    .hero h1 { font-family: 'Cormorant Garamond', serif; font-size: 64px; line-height: 1.1; margin-bottom: 20px; }
    .badge { background: rgba(16, 185, 129, 0.1); color: var(--primary); padding: 8px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; margin-bottom: 15px; display: inline-block; }

    .section-title { text-align: center; margin: 80px 0 50px; }
    .section-title h2 { font-size: 32px; margin-bottom: 10px; }

    .board-container { margin: 0 10% 80px; background: var(--card-bg); border-radius: 30px; padding: 40px; border: 1px solid var(--border); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 500px; }
    th { text-align: left; padding: 15px; color: var(--text-gray); border-bottom: 1px solid var(--border); }
    td { padding: 20px 15px; border-bottom: 1px solid var(--border); }
    .rank { font-weight: 700; color: var(--primary); }
    .status-badge { padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; }

    /* APRESIASI KELAS - KOTAK ESTETIK */
    .ambassador-section { padding: 80px 10%; text-align: center; background: linear-gradient(to bottom, transparent, rgba(16, 185, 129, 0.05)); }
    .class-card { 
      max-width: 500px; margin: 0 auto; background: white; color: var(--bg); 
      padding: 20px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .class-img { 
      width: 100%; height: 280px; border-radius: 18px; 
      background: #f1f5f9; margin-bottom: 20px; overflow: hidden;
    }
    .class-img img { width: 100%; height: 100%; object-fit: cover; }

    footer { padding: 60px 10%; border-top: 1px solid var(--border); text-align: center; color: var(--text-gray); font-size: 14px; }

    @media (max-width: 768px) {
      .hero h1 { font-size: 40px; }
      .board-container { padding: 20px; margin: 0 5% 80px; }
    }
  </style>
</head>
<body>

  <div class="blob" style="top: -100px; right: -100px;"></div>
  <nav><div class="logo">CLEAN & CARE.</div></nav>

  <section class="hero">
    <div class="badge">Program Duta Lingkungan</div>
    <h1>Budaya Bersih,<br>Tanggung Jawab Bersama.</h1>
  </section>

  <div class="section-title"><h2>🏆 Clean Score Board</h2></div>
  <div class="board-container">
    <table>
      <thead>
        <tr><th>Rank</th><th>Kelas</th><th>Skor</th><th>Kategori</th></tr>
      </thead>
      <tbody id="scoreTable">
        </tbody>
    </table>
  </div>

  <section class="ambassador-section">
    <div class="section-title">
      <h2>✨ Class of The Month</h2>
      <p style="color: var(--text-gray);">Apresiasi untuk kelas paling konsisten bulan ini</p>
    </div>

    <div class="class-card">
      <div class="class-img">
        <img id="winnerImg" src="" style="display:none;">
        <div id="imgPlaceholder" style="padding-top: 120px; color: #64748b;">Memuat Foto...</div>
      </div>
      <h3 id="winnerName" style="font-size: 24px; margin-bottom: 5px;">...</h3>
      <p id="winnerQuote" style="font-style: italic; opacity: 0.8; font-size: 14px;">"..."</p>
    </div>
  </section>

  <footer><p>© 2026 Duta Lingkungan SMAN 1 Batujaya</p></footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBVSNnI0ZUE7QP9J0KLJ8ulGEp58RQU-v8",
      authDomain: "farid-dda74.firebaseapp.com",
      projectId: "farid-dda74",
      storageBucket: "farid-dda74.firebasestorage.app",
      messagingSenderId: "240445607623",
      appId: "1:240445607623:web:622f8d48c0236660c4f8e2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    onSnapshot(query(collection(db, "scoreboard"), orderBy("skor", "desc")), (snap) => {
      const table = document.getElementById('scoreTable');
      table.innerHTML = "";
      let i = 1;
      snap.forEach(doc => {
        const d = doc.data();
        const color = d.skor >= 90 ? "#34d399" : "#0ea5e9";
        const bg = d.skor >= 90 ? "rgba(52, 211, 153, 0.1)" : "rgba(14, 165, 233, 0.1)";
        table.innerHTML += `<tr><td class="rank">#${i++}</td><td>${d.kelas}</td><td>${d.skor}/100</td><td><span class="status-badge" style="color:${color}; background:${bg}">${d.skor >= 90 ? 'Sangat Baik' : 'Baik'}</span></td></tr>`;
      });
    });

    onSnapshot(doc(db, "apresiasi", "bulan_ini"), (docSnap) => {
      if (docSnap.exists()) {
        const d = docSnap.data();
        document.getElementById('winnerName').innerText = d.namaKelas;
        document.getElementById('winnerQuote').innerText = `"${d.quote}"`;
        const img = document.getElementById('winnerImg');
        img.src = d.fotoUrl;
        img.style.display = "block";
        document.getElementById('imgPlaceholder').style.display = "none";
      }
    });
  </script>
</body>
</html>
