<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBVSNnI0ZUE7QP9J0KLJ8ulGEp58RQU-v8",
        authDomain: "farid-dda74.firebaseapp.com",
        projectId: "farid-dda74",
        storageBucket: "farid-dda74.firebasestorage.app",
        messagingSenderId: "240445607623",
        appId: "1:240445607623:web:622f8d48c0236660c4f8e2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // UPDATE SKOR KELAS (Bisa input banyak kelas bergantian)
    document.getElementById('btnSkor').onclick = async () => {
        const k = document.getElementById('kelas').value.trim();
        const s = parseInt(document.getElementById('skor').value);
        
        if(!k || isNaN(s)) return alert("Isi nama kelas dan skornya dulu, Rid!");

        try {
            // Menggunakan nama kelas sebagai ID dokumen agar tidak duplikat
            await setDoc(doc(db, "scoreboard", k), { 
                kelas: k, 
                skor: s, 
                updatedAt: serverTimestamp() 
            });
            alert("Skor kelas " + k + " berhasil disimpan!");
            
            // Kosongkan input setelah berhasil biar bisa input kelas lain
            document.getElementById('kelas').value = "";
            document.getElementById('skor').value = "";
        } catch (e) {
            alert("Error: " + e.message);
        }
    };

    // UPDATE APRESIASI (Class of The Month)
    document.getElementById('btnApresiasi').onclick = async () => {
        const n = document.getElementById('namaKelasPemenang').value.trim();
        const f = document.getElementById('fotoUrl').value.trim();
        const q = document.getElementById('quoteKelas').value.trim();
        
        if(!n || !f) return alert("Nama kelas dan link foto wajib diisi!");

        try {
            await setDoc(doc(db, "apresiasi", "bulan_ini"), { 
                namaKelas: n, 
                fotoUrl: f, 
                quote: q, 
                updatedAt: serverTimestamp() 
            });
            alert("Data apresiasi berhasil diupdate!");
        } catch (e) {
            alert("Error: " + e.message);
        }
    };
</script>
